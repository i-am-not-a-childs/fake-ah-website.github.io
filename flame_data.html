<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flame Data</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1c1917;
      color: #e7e5e4;
    }
    .card {
      background: #292524;
      border: 1px solid #44403c;
      border-radius: 8px;
    }
    select {
      background: #3f3f46;
      border: 1px solid #57534e;
      color: #fafaf9;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
    }
    select:focus {
      outline: 2px solid #a8a29e;
    }
  </style>
</head>
<body class="min-h-screen pb-16">
  <div class="max-w-6xl mx-auto px-4 pt-6">
    <div class="flex gap-6 text-sm mb-8 border-b border-stone-700 pb-3">
      <a href="index.html" class="text-stone-300 hover:text-white">Home</a>
      <a href="questions.html" class="text-stone-300 hover:text-white">Questions</a>
    </div>
    <h1 class="text-2xl font-semibold mb-6 text-stone-100">Flame Data</h1>
    <div class="flex items-center gap-3 mb-8">
      <label for="labelFilter" class="text-sm text-stone-400">Filter:</label>
      <select id="labelFilter">
        <option value="all">All (dim + bright)</option>
        <option value="dim">Dim only</option>
        <option value="bright">Bright only</option>
      </select>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-10">
      <div class="card p-4">
        <div class="text-sm text-stone-400 mb-2">Diameter (mm) × Brightness</div>
        <div class="h-60 relative">
          <canvas id="chart1"></canvas>
        </div>
      </div>
      <div class="card p-4">
        <div class="text-sm text-stone-400 mb-2">Oxygen (%) × Brightness</div>
        <div class="h-60 relative">
          <canvas id="chart2"></canvas>
        </div>
      </div>
      <div class="card p-4">
        <div class="text-sm text-stone-400 mb-2">Airflow (cm/s) × Diameter</div>
        <div class="h-60 relative">
          <canvas id="chart3"></canvas>
        </div>
      </div>
      <div class="card p-4">
        <div class="text-sm text-stone-400 mb-2">Oxygen (%) × Airflow</div>
        <div class="h-60 relative">
          <canvas id="chart4"></canvas>
        </div>
      </div>
    </div>
    <div class="card p-5 mb-10">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
        <div>
          <h2 class="text-lg font-medium text-stone-100">Custom Scatter</h2>
          <p class="text-sm text-stone-500">Pick any two variables</p>
        </div>
        <div class="flex flex-wrap gap-4">
          <div class="flex items-center gap-2">
            <label class="text-xs text-stone-400">X:</label>
            <select id="xAxisSelect">
              <option value="oxygen_pct">Oxygen (%)</option>
              <option value="airflow_cm_s">Airflow (cm/s)</option>
              <option value="diameter_mm" selected>Diameter (mm)</option>
              <option value="brightness_au">Brightness</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-xs text-stone-400">Y:</label>
            <select id="yAxisSelect">
              <option value="oxygen_pct">Oxygen (%)</option>
              <option value="airflow_cm_s">Airflow (cm/s)</option>
              <option value="diameter_mm">Diameter (mm)</option>
              <option value="brightness_au" selected>Brightness</option>
            </select>
          </div>
        </div>
      </div>
      <div class="h-72 relative">
        <canvas id="customChart"></canvas>
      </div>
    </div>
    <div class="card overflow-hidden">
      <div class="px-5 py-3 border-b border-stone-700 flex justify-between items-center">
        <span class="text-sm text-stone-400">Data</span>
        <span class="text-sm text-stone-500">
          <span id="recordCount" class="text-stone-200 font-medium">20</span> records
        </span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-stone-900 text-stone-400 text-xs uppercase">
            <tr>
              <th class="py-3 px-5 text-left">Obs</th>
              <th class="py-3 px-5 text-left">Oxygen %</th>
              <th class="py-3 px-5 text-left">Airflow</th>
              <th class="py-3 px-5 text-left">Diameter</th>
              <th class="py-3 px-5 text-left">Brightness</th>
              <th class="py-3 px-5 text-left">Label</th>
            </tr>
          </thead>
          <tbody id="dataTableBody" class="divide-y divide-stone-700/80">
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    const dataset = [
      { observation: 'A', oxygen_pct: 16, airflow_cm_s: 2, diameter_mm: 12, brightness_au: 30, practice_label: 'dim' },
      { observation: 'B', oxygen_pct: 18, airflow_cm_s: 3, diameter_mm: 15, brightness_au: 38, practice_label: 'dim' },
      { observation: 'C', oxygen_pct: 19, airflow_cm_s: 4, diameter_mm: 18, brightness_au: 49, practice_label: 'dim' },
      { observation: 'D', oxygen_pct: 21, airflow_cm_s: 3, diameter_mm: 24, brightness_au: 65, practice_label: 'bright' },
      { observation: 'E', oxygen_pct: 22, airflow_cm_s: 5, diameter_mm: 27, brightness_au: 73, practice_label: 'bright' },
      { observation: 'F', oxygen_pct: 24, airflow_cm_s: 4, diameter_mm: 31, brightness_au: 83, practice_label: 'bright' },
      { observation: 'G', oxygen_pct: 17, airflow_cm_s: 7, diameter_mm: 14, brightness_au: 45, practice_label: 'dim' },
      { observation: 'H', oxygen_pct: 23, airflow_cm_s: 8, diameter_mm: 28, brightness_au: 78, practice_label: 'bright' },
      { observation: 'I', oxygen_pct: 20, airflow_cm_s: 6, diameter_mm: 23, brightness_au: 58, practice_label: 'dim' },
      { observation: 'J', oxygen_pct: 22, airflow_cm_s: 2, diameter_mm: 21, brightness_au: 61, practice_label: 'bright' },
      { observation: 'K', oxygen_pct: 18, airflow_cm_s: 8, diameter_mm: 19, brightness_au: 53, practice_label: 'dim' },
      { observation: 'L', oxygen_pct: 24, airflow_cm_s: 7, diameter_mm: 28, brightness_au: 71, practice_label: 'bright' },
      { observation: 'M', oxygen_pct: 21, airflow_cm_s: 7, diameter_mm: 20, brightness_au: 57, practice_label: 'dim' },
      { observation: 'N', oxygen_pct: 19, airflow_cm_s: 2, diameter_mm: 22, brightness_au: 60, practice_label: 'bright' },
      { observation: 'O', oxygen_pct: 23, airflow_cm_s: 3, diameter_mm: 25, brightness_au: 68, practice_label: 'bright' },
      { observation: 'P', oxygen_pct: 17, airflow_cm_s: 5, diameter_mm: 17, brightness_au: 42, practice_label: 'dim' },
      { observation: 'Q', oxygen_pct: 20, airflow_cm_s: 8, diameter_mm: 24, brightness_au: 63, practice_label: 'bright' },
      { observation: 'R', oxygen_pct: 22, airflow_cm_s: 7, diameter_mm: 22, brightness_au: 59, practice_label: 'dim' },
      { observation: 'S', oxygen_pct: 18, airflow_cm_s: 5, diameter_mm: 20, brightness_au: 58, practice_label: 'dim' },
      { observation: 'T', oxygen_pct: 21, airflow_cm_s: 4, diameter_mm: 23, brightness_au: 62, practice_label: 'bright' }
    ];
    const labelMap = {
      oxygen_pct: 'Oxygen (%)',
      airflow_cm_s: 'Airflow (cm/s)',
      diameter_mm: 'Diameter (mm)',
      brightness_au: 'Brightness (au)'
    };
    const ranges = {
      oxygen_pct:    { min: 15, max: 25 },
      airflow_cm_s:  { min: 1,  max: 9 },
      diameter_mm:   { min: 10, max: 33 },
      brightness_au: { min: 25, max: 90 }
    };
    const dimColor = '#5eead4';
    const brightColor = '#f97316';
    let charts = [];
    let customChartInstance = null;
    function getPoints(xKey, yKey, label) {
      return dataset
        .filter(d => d.practice_label === label)
        .map(d => ({ x: d[xKey], y: d[yKey], obs: d.observation }));
    }
    function createScatterConfig(xKey, yKey) {
      return {
        type: 'scatter',
        data: {
          datasets: [
            {
              label: 'dim',
              data: getPoints(xKey, yKey, 'dim'),
              backgroundColor: dimColor,
              borderColor: '#2dd4bf',
              borderWidth: 1,
              pointRadius: 5,
              pointHoverRadius: 7
            },
            {
              label: 'bright',
              data: getPoints(xKey, yKey, 'bright'),
              backgroundColor: brightColor,
              borderColor: '#ea580c',
              borderWidth: 1,
              pointRadius: 5,
              pointHoverRadius: 7
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: {
            legend: {
              labels: {
                color: '#a8a29e',
                font: { size: 12 }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const obs = context.raw.obs || '';
                  return ` ${obs}: (${context.parsed.x}, ${context.parsed.y})`;
                }
              }
            }
          },
          scales: {
            x: {
              min: ranges[xKey].min,
              max: ranges[xKey].max,
              title: {
                display: true,
                text: labelMap[xKey],
                color: '#a8a29e',
                font: { size: 12 }
              },
              grid: { color: 'rgba(68, 64, 60, 0.5)' },
              ticks: { color: '#a8a29e' }
            },
            y: {
              min: ranges[yKey].min,
              max: ranges[yKey].max,
              title: {
                display: true,
                text: labelMap[yKey],
                color: '#a8a29e',
                font: { size: 12 }
              },
              grid: { color: 'rgba(68, 64, 60, 0.5)' },
              ticks: { color: '#a8a29e' }
            }
          }
        }
      };
    }
    function applyFilter(chart, filterLabel) {
      if (!chart) return;
      const dimData = chart.data.datasets[0];
      const brightData = chart.data.datasets[1];
      if (filterLabel === 'all') {
        dimData.hidden = false;
        brightData.hidden = false;
      } else if (filterLabel === 'dim') {
        dimData.hidden = false;
        brightData.hidden = true;
      } else {
        dimData.hidden = true;
        brightData.hidden = false;
      }
      chart.update('none');
    }
    function renderMainCharts() {
      const configs = [
        { id: 'chart1', x: 'diameter_mm', y: 'brightness_au' },
        { id: 'chart2', x: 'oxygen_pct', y: 'brightness_au' },
        { id: 'chart3', x: 'airflow_cm_s', y: 'diameter_mm' },
        { id: 'chart4', x: 'oxygen_pct', y: 'airflow_cm_s' }
      ];
      charts.forEach(c => c.destroy());
      charts = [];
      configs.forEach(cfg => {
        const ctx = document.getElementById(cfg.id).getContext('2d');
        const chart = new Chart(ctx, createScatterConfig(cfg.x, cfg.y));
        charts.push(chart);
      });
    }
    function renderCustomChart() {
      const xKey = document.getElementById('xAxisSelect').value;
      const yKey = document.getElementById('yAxisSelect').value;
      if (customChartInstance) {
        customChartInstance.destroy();
      }
      const ctx = document.getElementById('customChart').getContext('2d');
      customChartInstance = new Chart(ctx, createScatterConfig(xKey, yKey));
      const filter = document.getElementById('labelFilter').value;
      applyFilter(customChartInstance, filter);
    }
    function renderTable(filterLabel = 'all') {
      const tbody = document.getElementById('dataTableBody');
      tbody.innerHTML = '';
      const filtered = filterLabel === 'all'
        ? dataset
        : dataset.filter(d => d.practice_label === filterLabel);
      document.getElementById('recordCount').textContent = filtered.length;
      filtered.forEach(row => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-stone-800/60';
        const isDim = row.practice_label === 'dim';
        const badgeClass = isDim
          ? 'bg-teal-950 text-teal-300 border border-teal-800'
          : 'bg-orange-950 text-orange-300 border border-orange-800';
        tr.innerHTML = `
          <td class="py-2.5 px-5 font-medium text-stone-100">${row.observation}</td>
          <td class="py-2.5 px-5">${row.oxygen_pct}</td>
          <td class="py-2.5 px-5">${row.airflow_cm_s}</td>
          <td class="py-2.5 px-5">${row.diameter_mm}</td>
          <td class="py-2.5 px-5">${row.brightness_au}</td>
          <td class="py-2.5 px-5">
            <span class="inline-block text-xs px-2 py-0.5 rounded ${badgeClass}">
              ${row.practice_label}
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }
    document.getElementById('labelFilter').addEventListener('change', (e) => {
      const filter = e.target.value;
      charts.forEach(c => applyFilter(c, filter));
      applyFilter(customChartInstance, filter);
      renderTable(filter);
    });
    document.getElementById('xAxisSelect').addEventListener('change', renderCustomChart);
    document.getElementById('yAxisSelect').addEventListener('change', renderCustomChart);
    window.onload = function() {
      renderMainCharts();
      renderCustomChart();
      renderTable();
    };
  </script>
</body>
</html>
```
